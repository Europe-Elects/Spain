<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spain – Congress Vote by Area</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/map.css">
<style>
  #tooltip { min-width: 300px; }
  #tooltip .bar-label { width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 id="title">Spain · Congress vote</h1>
    <div class="subtitle" id="subtitle">&nbsp;</div>
    <div class="status-row">
      <span class="last-updated" id="lastUpdated">Last updated: –</span>
      <span class="counted-pill" id="countedPill"></span>
      <span class="demo-pill" id="demoPill" hidden>Demo · 2023 result</span>
    </div>
  </div>
  <div class="tab-row">
    <div class="level-tabs" id="yearTabs" role="tablist" aria-label="Election"></div>
    <div class="level-tabs" id="levelTabs" role="tablist" aria-label="Level"></div>
  </div>
  <div id="map-container" style="overflow:hidden">
    <div class="map-logo"><img src="logo.png?v=2" alt="Europe Elects"></div>
    <svg id="map" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="emptyState" class="empty-state" hidden><span></span></div>
    <div id="tooltip"></div>
    <div class="zoom-controls">
      <button class="zoom-btn" id="zoomIn" title="Zoom in">+</button>
      <div class="zoom-level" id="zoomLevel">1.0x</div>
      <button class="zoom-btn" id="zoomOut" title="Zoom out">−</button>
      <button class="zoom-btn reset" id="zoomReset" title="Reset view">↺</button>
    </div>
  </div>
  <div class="cta" role="note">
    <span class="cta-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
    <span>Tap a party below to shade the map by its vote share</span>
  </div>
  <div class="legend" id="legend"></div>
  <div class="legend-hint" id="legendHint">Colour = party with the most votes · Europe Elects colours by European Parliament group</div>
  <div class="footer" id="footer">· Chart made by Andrei Miclea · Source: Ministerio del Interior</div>
</div>
<script src="assets/map-utils.js"></script>
<script src="assets/es-parties.js"></script>
<script src="assets/es-map.js"></script>
<script>
(function () {
  const { NO_DATA_COLOR, isLightFill, partyShade, cssId, buildSplitPatterns, loadResults, autoRefresh,
          formatTs, setCountedPill, setLiveDot } = window.EE;
  const { NS, LEVELS, loadShapes, drawInset, levelTabs, moveTooltip, shortName, svgText, isDemo,
          yearTabs, loadYear, EMPTY_NOTE } = window.ES_MAP;
  const { info } = window.ES_PARTIES;

  // 2023: this file. 2026: the live maps file, empty until it exists (ES_MAP.loadYear).
  const DATA_URL = 'spain_2023_results_demo.json';
  const HINT = 'Colour = party with the most votes · Europe Elects colours by European Parliament group';

  let year, level, data = null, focus = null;
  const PARTIES = {};

  // The party with the most votes, leaving out "Others".
  function winner(row) {
    if (!row) return null;
    let best = null;
    data.parties.forEach(k => {
      if (k !== 'OTHERS' && typeof row[k] === 'number' && (!best || row[k] > best.pct)) best = { party: k, pct: row[k] };
    });
    return best && best.pct > 0 ? best : null;
  }
  const fillOf = k => PARTIES[k].color2 ? `url(#split-${cssId(k)})` : PARTIES[k].color;

  async function init() {
    year = yearTabs(document.getElementById('yearTabs'), y => { year = y; focus = null; refresh(true); });
    await refresh(true);
    autoRefresh(refresh, 60000);
  }

  // `tabs`: rebuild the level tabs (on start and when the year changes). Municipalities
  // exist only in the 2023 file; the live file has regions and provinces.
  async function refresh(tabs) {
    await window.ES_PARTIES.ready;  // Europarty and EP group from the party database (labels)
    const y = year;
    const d = await loadYear(y, DATA_URL);
    if (y !== year) return;  // the year changed while this was loading
    data = d;
    if (tabs === true) {
      level = levelTabs(document.getElementById('levelTabs'),
                        ['regions', 'provinces'].concat(data.municipalities ? ['municipalities'] : []),
                        lv => { level = lv; render(); });
    }
    data.parties.forEach(k => { const i = info(k); PARTIES[k] = { color: i.color, color2: i.color2, name: i.label, groupLabel: i.groupLabel }; });
    await render();
  }

  async function render() {
    const demo = isDemo(data);
    const L = LEVELS[level];
    document.getElementById('title').textContent = `Spain ${demo ? '2023' : '2026'} · Congress vote by ${L.one}`;
    const t = data.national.turnout;
    document.getElementById('subtitle').textContent = `Vote share across ${L.count}` + (typeof t === 'number' ? ` · turnout ${t.toFixed(1)}%` : '');
    document.getElementById('demoPill').hidden = !demo;
    const lu = document.getElementById('lastUpdated');
    lu.textContent = demo ? 'Official final result, 23 July 2023'
      : data.empty ? 'Waiting for results' : 'Last updated: ' + formatTs(data.fetched_at);
    setLiveDot(lu, !demo && data.counted_pct < 100);
    setCountedPill(document.getElementById('countedPill'), demo ? null : data.counted_pct);
    document.getElementById('footer').textContent = '· Chart made by Andrei Miclea · Source: Ministerio del Interior'
      + (demo ? ' (infoelectoral, official final result 2023)' : ' (provisional count)');
    const sh = await loadShapes(level);
    build(sh, data[level] || {});
    buildLegend();
  }

  function build(sh, rows) {
    const svg = document.getElementById('map');
    svg.innerHTML = '';
    buildSplitPatterns(svg, PARTIES);
    const muni = level === 'municipalities';
    let max = 0;
    if (focus) Object.values(rows).forEach(r => { if (typeof r[focus] === 'number' && r[focus] > max) max = r[focus]; });
    max = Math.max(10, max * 1.05);

    sh.list.forEach(s => {
      const row = rows[s.id];
      let fill = NO_DATA_COLOR, op = null;
      if (focus) {
        const pct = row ? row[focus] : null;
        if (PARTIES[focus].color2) { fill = fillOf(focus); op = pct > 0 ? Math.max(.12, Math.min(1, pct / max)) : .04; }
        else fill = partyShade(pct, max, PARTIES[focus].color);
      } else {
        const w = winner(row);
        if (w) fill = fillOf(w.party);
      }
      const p = document.createElementNS(NS, 'path');
      p.setAttribute('d', s.d); p.setAttribute('class', 'county' + (muni ? ' muni' : '')); p.setAttribute('fill', fill);
      if (op !== null) p.setAttribute('fill-opacity', op);
      p.addEventListener('mouseenter', e => showTooltip(e, s, row));
      p.addEventListener('mousemove', e => moveTooltip(e, 300));
      p.addEventListener('mouseleave', () => document.getElementById('tooltip').style.display = 'none');
      svg.appendChild(p);
    });
    drawInset(svg, sh);

    // Labels: names and the leading share for regions; the leading share for provinces.
    if (!muni) sh.list.forEach(s => {
      const row = rows[s.id];
      const w = winner(row);
      const pct = focus ? (row ? row[focus] : null) : (w || {}).pct;
      if (pct == null || s.cx == null) return;
      const light = isLightFill(focus ? partyShade(pct, max, PARTIES[focus].color) : PARTIES[w.party].color);
      if (level === 'regions') svgText(svg, s.cx, s.cy - 3, 'county-label' + (light ? '' : ' light'), shortName(s.name));
      svgText(svg, s.cx, s.cy + (level === 'regions' ? 8 : 3), 'county-pct' + (light ? '' : ' light'), pct.toFixed(1) + '%');
    });

    const es = document.getElementById('emptyState');
    es.hidden = Object.keys(rows).length > 0;
    es.firstElementChild.textContent = data.empty ? EMPTY_NOTE
      : `No ${LEVELS[level].one} results yet. They appear here as the ministry publishes them.`;

    window.EE.enableZoomPan(svg, { controls: { zoomIn: 'zoomIn', zoomOut: 'zoomOut', zoomReset: 'zoomReset', zoomLevel: 'zoomLevel' }, maxK: muni ? 40 : 12 });
  }

  function showTooltip(e, s, row) {
    const tt = document.getElementById('tooltip');
    let html = `<h3>${row ? row.name : s.name}</h3>`;
    if (row) {
      const t = row.turnout;
      const meta = [typeof t === 'number' ? `Turnout ${t.toFixed(1)}%` : null,
                    typeof row.counted_pct === 'number' && row.counted_pct < 100 ? `${row.counted_pct.toFixed(1)}% counted` : null].filter(Boolean);
      if (meta.length) html += `<div class="tt-meta">${meta.join(' · ')}</div>`;
      data.parties.filter(k => typeof row[k] === 'number' && row[k] > 0)
        .sort((a, b) => (a === 'OTHERS') - (b === 'OTHERS') || row[b] - row[a]).forEach(k => {
          const P = PARTIES[k], active = focus === k;
          html += `<div class="bar-row"${active ? ' style="font-weight:700"' : ''}>
            <div class="bar-label" style="color:${P.color === '#CBD5E1' ? '#64748B' : P.color}">${P.name}${P.groupLabel ? ` <span style="color:#94A3B8;font-weight:400">${P.groupLabel}</span>` : ''}</div>
            <div class="bar-container"><div class="bar-fill" style="width:${row[k]}%;background:${P.color}"></div></div>
            <div class="bar-pct">${row[k].toFixed(1)}%</div></div>`;
        });
    } else html += '<div class="no-data">No data</div>';
    tt.innerHTML = html; tt.style.display = 'block'; moveTooltip(e, 300);
  }

  function buildLegend() {
    const lg = document.getElementById('legend');
    lg.innerHTML = '';
    data.parties.filter(k => k !== 'OTHERS').forEach(k => {
      const P = PARTIES[k];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'legend-item clickable' + (focus === k ? ' active' : '');
      btn.setAttribute('aria-pressed', focus === k ? 'true' : 'false');
      const sw = P.color2 ? `linear-gradient(135deg, ${P.color} 0 50%, ${P.color2} 50% 100%)` : P.color;
      const nat = data.national[k];
      btn.innerHTML = `<div class="legend-swatch" style="background:${sw}"></div>${P.name}`
        + (P.groupLabel ? `<span class="legend-group">${P.groupLabel}</span>` : '')
        + (typeof nat === 'number' ? `<span class="legend-pct">${nat.toFixed(1)}%</span>` : '');
      btn.onclick = () => {
        focus = focus === k ? null : k;
        document.getElementById('legendHint').textContent = focus
          ? `Showing ${P.name} — tap again to return to the winner view` : HINT;
        render();
      };
      lg.appendChild(btn);
    });
  }

  init();
})();
</script>
</body>
</html>
