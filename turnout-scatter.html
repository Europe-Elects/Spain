<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spain – Turnout and Vote Share</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/map.css?v=20261128h">
<style>
  /* a normal scrolling page (the maps fill a fixed-height frame instead), so its height can be measured */
  html, body { height: auto; } body { display: block; overflow: visible; } .container { flex: none; }
  #chart-wrap { position: relative; background: #fff; border: 1px solid #E4E2DB; border-radius: 8px; padding: 8px 6px 4px; margin-top: 10px; }
  #chart { display: block; width: 100%; height: auto; touch-action: none; }
  #chart .grid line { stroke: #ECEAE4; }
  #chart .axis text { font: 500 13px 'Advent Pro', system-ui, sans-serif; fill: #8B8F98; }
  #chart .axis-title { font: 600 14px 'Advent Pro', system-ui, sans-serif; fill: #565B66; }
  #chart .ref line { stroke: #565B66; stroke-width: 1; stroke-dasharray: 4 4; }
  #chart .ref text { font: 600 13px 'Advent Pro', system-ui, sans-serif; fill: #565B66; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
  #chart .hit { fill: none; stroke: #1A1D23; stroke-width: 2; pointer-events: none; }
  #tooltip { min-width: 0; }
  #tooltip .row { display: flex; justify-content: space-between; gap: 18px; }
  #tooltip .row b { font-variant-numeric: tabular-nums; }
  .note { font-size: 13px; color: #8B8F98; margin-top: 6px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Spain · National parliament election (lower house) 2023</h1>
    <div class="subtitle" id="subtitle">Turnout against vote share</div>
    <div class="status-row">
      <span class="demo-pill">Official final result, 23 July 2023</span>
    </div>
  </div>
  <div class="tab-row">
    <div class="level-tabs" id="levelTabs" role="tablist" aria-label="Level"></div>
  </div>
  <div class="legend" id="parties" role="group" aria-label="Party"></div>
  <div id="chart-wrap">
    <svg id="chart" viewBox="0 0 1000 560" role="img" aria-labelledby="chartLabel"><title id="chartLabel">Turnout against vote share</title></svg>
    <div id="tooltip"></div>
  </div>
  <div class="note" id="note"></div>
  <div class="footer">· Chart made by Andrei Miclea · Source: Ministerio del Interior (infoelectoral, official final result 2023)</div>
</div>
<script src="assets/map-utils.js?v=20261128f"></script>
<script src="assets/es-parties.js?v=20261128h"></script>
<script src="assets/party-card.js?v=20261128f"></script>
<script src="assets/es-map.js?v=20261127b"></script>
<script>
(function () {
  'use strict';
  const { LEVELS, levelTabs } = window.ES_MAP;
  const NS = 'http://www.w3.org/2000/svg';
  const DATA_URL = 'spain_2023_results_demo.json';
  let W = 1000, H = 560; const M = { l: 58, r: 22, t: 18, b: 52 };
  const svg = document.getElementById('chart'), tip = document.getElementById('tooltip');
  const params = new URLSearchParams(location.search);

  let data, level, party, pts = [];
  const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
  const fmt = (v) => v.toFixed(1).replace(/\.0$/, '.0') + '%';

  async function init() {
    data = await (await fetch(DATA_URL)).json();
    await window.ES_PARTIES.ready;
    // Parties with a national vote, largest first; "Others" is a bundle, not a party, so it has no button.
    const keys = data.parties.filter((k) => k !== 'OTHERS' && typeof data.national[k] === 'number')
      .sort((a, b) => data.national[b] - data.national[a]);
    const asked = params.get('party');
    party = keys.includes(asked) ? asked : keys[0];
    level = levelTabs(document.getElementById('levelTabs'), ['municipalities', 'provinces'], (lv) => { level = lv; draw(); });
    const box = document.getElementById('parties');
    keys.forEach((k) => {
      const i = window.ES_PARTIES.info(k);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'legend-item clickable'; b.dataset.k = k;
      const sw = i.color2 ? `linear-gradient(135deg, ${i.color} 0 50%, ${i.color2} 50% 100%)` : i.color;
      b.innerHTML = `<div class="legend-swatch" style="background:${sw}"></div>${window.ES_PARTIES.ideo(i)}${i.label}`
        + (i.groupLabel ? `<span class="legend-group">${i.groupLabel}</span>` : '')
        + `<span class="legend-pct">${data.national[k].toFixed(1)}%</span>`;
      b.onclick = () => { party = k; draw(); };
      if (window.ES_CARD) window.ES_CARD.attach(b, () => ({ info: i, stats: [['Vote', data.national[k].toFixed(1) + '%']] }));
      box.appendChild(b);
    });
    draw();
  }

  function draw() {
    // Drawn at the frame's real width, so labels keep their size on a phone.
    W = Math.max(320, Math.round(document.getElementById('chart-wrap').clientWidth - 12));
    H = W < 640 ? Math.round(W * 0.95) : Math.round(Math.min(560, W * 0.56));
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const P = window.ES_PARTIES.info(party);
    document.querySelectorAll('#parties .legend-item').forEach((b) => {
      const on = b.dataset.k === party; b.classList.toggle('active', on); b.setAttribute('aria-pressed', on);
    });
    const areas = data[level], prov = data.provinces;
    pts = Object.entries(areas).map(([id, a]) => ({
      id, name: a.name, x: a.turnout, y: a[party],
      sub: level === 'municipalities' && prov[id.slice(0, 2)] ? prov[id.slice(0, 2)].name : '',
    })).filter((p) => Number.isFinite(p.x) && Number.isFinite(p.y));   // only where the party ran

    // Axes: turnout on x, the party's vote share on y, both rounded out to the nearest 10.
    const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
    const x0 = Math.max(0, Math.floor(Math.min(...xs) / 10) * 10), x1 = Math.min(100, Math.ceil(Math.max(...xs) / 10) * 10);
    const y1 = Math.min(100, Math.max(10, Math.ceil(Math.max(...ys) / 10) * 10));
    const sx = (v) => M.l + (v - x0) / (x1 - x0) * (W - M.l - M.r);
    const sy = (v) => H - M.b - v / y1 * (H - M.t - M.b);
    const step = (span) => span > 60 ? 20 : span > 25 ? 10 : 5;

    svg.querySelectorAll(':scope > g').forEach((g) => g.remove());
    const grid = el('g', { class: 'grid' }, svg), axis = el('g', { class: 'axis' }, svg);
    for (let v = 0; v <= y1 + 1e-9; v += step(y1)) {
      el('line', { x1: M.l, x2: W - M.r, y1: sy(v), y2: sy(v) }, grid);
      el('text', { x: M.l - 8, y: sy(v) + 4, 'text-anchor': 'end' }, axis).textContent = v + (v === y1 ? '%' : '');
    }
    for (let v = x0; v <= x1 + 1e-9; v += step(x1 - x0)) {
      el('line', { x1: sx(v), x2: sx(v), y1: M.t, y2: H - M.b }, grid);
      el('text', { x: sx(v), y: H - M.b + 18, 'text-anchor': 'middle' }, axis).textContent = v + (v === x1 ? '%' : '');
    }
    el('text', { class: 'axis-title', x: (M.l + W - M.r) / 2, y: H - 10, 'text-anchor': 'middle' }, svg.appendChild(el('g', {}))).textContent = 'Turnout';
    el('text', { class: 'axis-title', x: 16, y: (M.t + H - M.b) / 2, 'text-anchor': 'middle', transform: `rotate(-90 16 ${(M.t + H - M.b) / 2})` }, svg.lastChild)
      .textContent = `${P.label} vote share, 2023`;

    // Dots: one per area, in the party's colour. Many small municipalities overlap, so they are see-through.
    const many = pts.length > 200, r = many ? 2.6 : 6;
    const dots = el('g', {}, svg);
    pts.forEach((p) => {
      p.cx = sx(p.x); p.cy = sy(p.y);
      el('circle', { cx: p.cx, cy: p.cy, r, fill: P.color, 'fill-opacity': many ? 0.35 : 0.8, stroke: many ? 'none' : '#fff', 'stroke-width': 1 }, dots);
    });

    // Spain as a whole (resident voters, as the areas are): dashed reference lines.
    const ref = el('g', { class: 'ref' }, svg);
    const natT = Number.isFinite(data.national.t20) ? data.national.t20 : data.national.turnout, natV = data.national[party];
    if (natT >= x0 && natT <= x1) {
      el('line', { x1: sx(natT), x2: sx(natT), y1: M.t, y2: H - M.b }, ref);
      el('text', { x: sx(natT) + 6, y: M.t + 12 }, ref).textContent = `Spain ${fmt(natT)}`;
    }
    el('line', { x1: M.l, x2: W - M.r, y1: sy(natV), y2: sy(natV) }, ref);
    el('text', { x: W - M.r - 4, y: sy(natV) - 6, 'text-anchor': 'end' }, ref).textContent = `Spain ${fmt(natV)}`;
    el('circle', { class: 'hit', r: r + 3, cx: -99, cy: -99 }, svg.appendChild(el('g', {})));

    document.getElementById('subtitle').textContent = `Turnout against ${P.label} vote share · by ${LEVELS[level].one}`;
    document.getElementById('note').textContent =
      `Each dot is a ${LEVELS[level].one} where ${P.label} stood (${pts.length.toLocaleString('en')}). `
      + 'Turnout of resident voters; the vote from abroad is counted nationally, not by area. '
      + (level === 'municipalities' ? 'Dots are not sized by population, so the many small municipalities weigh as much as the large ones.' : '');
    hide();
  }

  // Hover / tap: the nearest dot within reach.
  function locate(e) {
    const r = svg.getBoundingClientRect(), k = W / r.width;
    const mx = (e.clientX - r.left) * k, my = (e.clientY - r.top) * k;
    let best = null, bd = (18 * k) ** 2;
    for (const p of pts) { const d = (p.cx - mx) ** 2 + (p.cy - my) ** 2; if (d < bd) { bd = d; best = p; } }
    return best;
  }
  function show(e) {
    const p = locate(e); if (!p) return hide();
    const P = window.ES_PARTIES.info(party), hit = svg.querySelector('.hit');
    hit.setAttribute('cx', p.cx); hit.setAttribute('cy', p.cy);
    tip.innerHTML = `<h3>${p.name}${p.sub ? `<span class="bg-name">${p.sub}</span>` : ''}</h3>`
      + `<div class="row"><span>Turnout</span><b>${fmt(p.x)}</b></div>`
      + `<div class="row"><span>${window.ES_PARTIES.ideo(P)}${P.label}</span><b>${fmt(p.y)}</b></div>`;
    tip.style.display = 'block';
    const wrap = document.getElementById('chart-wrap').getBoundingClientRect();
    let x = e.clientX - wrap.left + 14, y = e.clientY - wrap.top + 14;
    if (x + tip.offsetWidth > wrap.width - 4) x = e.clientX - wrap.left - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > wrap.height - 4) y = e.clientY - wrap.top - tip.offsetHeight - 14;
    tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
  }
  function hide() { tip.style.display = 'none'; const h = svg.querySelector('.hit'); if (h) { h.setAttribute('cx', -99); h.setAttribute('cy', -99); } }
  let rw = 0;
  window.addEventListener('resize', () => { const w = document.getElementById('chart-wrap').clientWidth; if (data && Math.abs(w - rw) > 30) { rw = w; draw(); } });
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', hide);

  // Inside the election-night dashboard: tell it how tall this page is, so the frame fits.
  function postHeight() {
    const h = Math.ceil(document.body.getBoundingClientRect().height) + 2;
    if (window.parent !== window) window.parent.postMessage({ type: 'ee-height', h }, '*');
  }
  new ResizeObserver(postHeight).observe(document.body);

  init();
})();
</script>
</body>
</html>
